<div id="sa-app">
  <div id="sa-content"><p style="color:var(--text-muted);text-align:center;padding:20px">加载中...</p></div>
  <div style="margin-top:16px;display:flex;gap:12px;align-items:center">
    <button class="btn btn-primary" onclick="_saSave()">💾 保存配置</button>
    <button class="btn btn-ghost" onclick="_saLoad()">↻ 重新加载</button>
    <span style="font-size:12px;color:var(--text-muted)">保存后自动重载，部分配置需重启服务</span>
  </div>
</div>
<style>
#sa-app .section-title{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-secondary);margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);display:flex;justify-content:space-between;align-items:center}
#sa-app .config-table{width:100%;border-collapse:collapse;margin-bottom:16px}
#sa-app .config-table td{padding:8px 12px;border-bottom:1px solid var(--border-subtle);font-size:13px}
#sa-app .config-table td:first-child{width:160px;color:var(--text-secondary);font-weight:500}
#sa-app .config-table td:last-child{color:var(--text-muted);font-size:12px}
#sa-app input[type=text],#sa-app input[type=number]{width:100%;padding:6px 10px;background:rgba(0,0,0,0.25);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px}
#sa-app input:focus{outline:none;border-color:var(--blue)}
#sa-app input:disabled{opacity:0.5;cursor:not-allowed}
#sa-app .svc-card{padding:14px 18px;margin-bottom:10px;background:rgba(0,0,0,0.2);border:1px solid var(--border-subtle);border-radius:8px}
#sa-app .svc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#sa-app .svc-fields{display:flex;flex-wrap:wrap;gap:12px;font-size:12px}
#sa-app .svc-field{flex:1;min-width:140px}
#sa-app .svc-field label{display:block;color:var(--text-muted);font-size:11px;margin-bottom:3px}
#sa-app .svc-field input{width:100%;margin:0}
#sa-app .tag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px}
</style>
<script>
let _saData=null;

async function _saApi(path,opts){
  var token=sessionStorage.getItem('agent_token')||localStorage.getItem('agent_token')||'';
  var headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
  var resp=await fetch(path,Object.assign({},opts,{headers:headers}));
  return resp.json();
}

function _saEsc(s){return String(s||'').replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

async function _saLoad(){
  try{
    var j=await _saApi('/api/getconfig');
    if(j.code!==0){document.getElementById('sa-content').innerHTML='<p style="color:var(--red)">'+_saEsc(j.message)+'</p>';return}
    _saData=j.data;_saRender();
  }catch(e){document.getElementById('sa-content').innerHTML='<p style="color:var(--red)">加载失败：'+_saEsc(e.message)+'</p>'}
}

function _saRender(){
  var fields=(_saData&&_saData.fields)||[];
  var services=(_saData&&_saData.services)||[];
  var html='';

  // 应用服务
  html+='<div class="section-title"><span>应用服务（'+services.length+'）</span><button class="btn btn-sm btn-primary" onclick="_saAdd()">+ 新增服务</button></div>';
  if(services.length){
    for(var i=0;i<services.length;i++){
      var s=services[i];
      var en=/true/i.test(s.Enable||'');
      html+='<div class="svc-card"><div class="svc-header">';
      html+='<div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:'+(en?'var(--green)':'var(--text-muted)')+'"></span><input type="text" id="sa-svc-'+i+'-Name" value="'+_saEsc(s.Name||'')+'" style="font-weight:600;background:transparent;border:none;border-bottom:1px dashed var(--border);min-width:120px;color:var(--text-primary)"></div>';
      html+='<div style="display:flex;align-items:center;gap:10px"><span style="font-size:11px;color:var(--text-muted)">启用</span><label class="toggle"><input type="checkbox" id="sa-svc-'+i+'-Enable" '+(en?'checked':'')+'><span class="track"><span class="thumb"></span></span></label><button class="btn btn-sm btn-ghost" onclick="_saDelete('+i+')" style="color:var(--red)">🗑 删除</button></div>';
      html+='</div><div class="svc-fields">';
      var keys=['FileName','Arguments','WorkingDirectory','UserName','Mode','MaxMemory'];
      for(var k=0;k<keys.length;k++){
        var key=keys[k];
        html+='<div class="svc-field"><label>'+key+'</label><input type="text" id="sa-svc-'+i+'-'+key+'" value="'+_saEsc(s[key]||'')+'"></div>';
      }
      html+='</div></div>';
    }
  }else{
    html+='<div style="padding:20px;text-align:center;color:var(--text-muted)">暂无应用服务，点击右上角新增</div>';
  }

  // 运行时配置
  var editFields=fields.filter(function(f){return f.category==='editable'});
  if(editFields.length){
    html+='<div class="section-title">运行时配置<span style="font-weight:400;color:var(--text-muted);margin-left:8px;font-size:11px;text-transform:none">修改后立即生效</span></div>';
    html+='<table class="config-table"><tbody>';
    for(var i=0;i<editFields.length;i++){
      var f=editFields[i];
      var inp='';
      if(f.type==='boolean'){inp='<label class="toggle"><input type="checkbox" id="sa-fld-'+f.name+'" '+(/true/i.test(f.value)?'checked':'')+'><span class="track"><span class="thumb"></span></span></label>'}
      else if(f.type==='int32'){inp='<input type="number" id="sa-fld-'+f.name+'" value="'+_saEsc(f.value)+'">'}
      else{inp='<input type="text" id="sa-fld-'+f.name+'" value="'+_saEsc(f.value)+'">'}
      html+='<tr><td>'+_saEsc(f.name)+'</td><td>'+inp+'</td><td>'+_saEsc(f.comment||'')+'</td></tr>';
    }
    html+='</tbody></table>';
  }

  // 启动参数（只读）
  var roFields=fields.filter(function(f){return f.category!=='editable'});
  if(roFields.length){
    html+='<details><summary style="font-size:13px;font-weight:600;color:var(--text-secondary);margin:20px 0 12px;cursor:pointer">启动参数（只读）</summary>';
    html+='<table class="config-table"><tbody>';
    for(var i=0;i<roFields.length;i++){
      var f=roFields[i];
      var tag=f.category==='system'?'<span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-muted)">系统字段</span>':'<span class="tag" style="background:rgba(245,158,11,0.15);color:var(--yellow)">需重启</span>';
      html+='<tr><td>'+_saEsc(f.name)+tag+'</td><td><input type="text" value="'+_saEsc(f.value)+'" disabled></td><td>'+_saEsc(f.comment||'')+'</td></tr>';
    }
    html+='</tbody></table></details>';
  }

  document.getElementById('sa-content').innerHTML=html;
}

function _saCollect(){
  var fields=((_saData&&_saData.fields)||[]).map(function(f){
    var el=document.getElementById('sa-fld-'+f.name);
    var value=f.value;
    if(el){value=el.type==='checkbox'?(el.checked?'true':'false'):el.value}
    return {name:f.name,value:value};
  });
  var services=((_saData&&_saData.services)||[]).map(function(s,i){
    var o={};
    Object.keys(s).forEach(function(k){o[k]=s[k]});
    var keys=['Name','Enable','FileName','Arguments','WorkingDirectory','UserName','Mode','MaxMemory'];
    for(var k=0;k<keys.length;k++){
      var key=keys[k];
      var el=document.getElementById('sa-svc-'+i+'-'+key);
      if(el){o[key]=el.type==='checkbox'?(el.checked?'true':'false'):el.value}
    }
    return o;
  });
  return {fields:fields,services:services};
}

function _saAdd(){
  var data=_saCollect();
  data.services.push({Name:'NewService',FileName:'',Arguments:'',WorkingDirectory:'',UserName:'',Enable:'false',Mode:'Default',MaxMemory:'0'});
  _saData.fields=data.fields;_saData.services=data.services;_saRender();
}

function _saDelete(i){
  var data=_saCollect();
  if(!confirm('确定删除服务"'+(data.services[i]&&data.services[i].Name||'')+'"吗？'))return;
  data.services.splice(i,1);
  _saData.fields=data.fields;_saData.services=data.services;_saRender();
}

async function _saSave(){
  var data=_saCollect();
  try{
    var j=await _saApi('/api/saveconfig',{method:'POST',body:JSON.stringify({content:JSON.stringify(data)})});
    if(j.code===0){alert(j.message);await _saLoad()}else{alert(j.message)}
  }catch(e){alert('保存失败：'+e.message)}
}

_saLoad();
</script>
